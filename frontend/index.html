<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дашборд — Complaint Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="logo-icon">⚡</span>
      Complaint Detection
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item active"><i class="fas fa-th-large"></i> Дашборд</a>
      <a href="bots.html" class="nav-item"><i class="fas fa-robot"></i> Боты</a>
      <a href="messages.html" class="nav-item"><i class="fas fa-envelope"></i> Сообщения</a>
      <a href="analytics.html" class="nav-item"><i class="fas fa-chart-line"></i> Аналитика</a>
      <a href="simulation.html" class="nav-item"><i class="fas fa-flask"></i> Симуляция</a>
      <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Настройки</a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" class="nav-item"><i class="fas fa-sign-out-alt"></i> Выйти</a>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="header-left">
        <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
          <i class="fas fa-bars"></i>
        </button>
        <h1>Дашборд</h1>
      </div>
      <div class="header-right">
        <span class="badge-status"><span class="badge-dot"></span> Система активна</span>
      </div>
    </header>

    <div class="content">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-icon icon-blue"><i class="fas fa-envelope"></i></div>
          <div class="stat-label">Всего сообщений</div>
          <div class="stat-value" id="totalMessages">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-red"><i class="fas fa-exclamation-triangle"></i></div>
          <div class="stat-label">Негативные</div>
          <div class="stat-value" id="negativePercent">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-yellow"><i class="fas fa-flag"></i></div>
          <div class="stat-label">Жалобы</div>
          <div class="stat-value" id="complaints">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-green"><i class="fas fa-robot"></i></div>
          <div class="stat-label">Активные боты</div>
          <div class="stat-value" id="activeBots">—</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3><i class="fas fa-smile" style="margin-right:8px;color:var(--primary);"></i> Тональность</h3>
          <canvas id="sentimentChart"></canvas>
        </div>
        <div class="chart-card">
          <h3><i class="fas fa-heart" style="margin-right:8px;color:var(--danger);"></i> Эмоции</h3>
          <canvas id="emotionChart"></canvas>
        </div>
      </div>

      <div class="card" style="margin-top:28px;">
        <div class="card-header">
          <h3><i class="fas fa-clock" style="margin-right:8px;color:var(--text-secondary);"></i> Последние сообщения</h3>
        </div>
        <div class="card-body" style="padding-top:0;">
          <div class="table-container" style="box-shadow:none;border:none;" id="recentMessages">
            <table>
              <thead>
                <tr>
                  <th>Имя</th>
                  <th>Сообщение</th>
                  <th>Тональность</th>
                  <th>Приоритет</th>
                </tr>
              </thead>
              <tbody id="recentMessagesBody">
                <tr><td colspan="4" class="empty-state">Загрузка...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
