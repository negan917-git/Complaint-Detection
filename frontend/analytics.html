<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналитика — Complaint Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="logo-icon">⚡</span>
      Complaint Detection
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item"><i class="fas fa-th-large"></i> Дашборд</a>
      <a href="bots.html" class="nav-item"><i class="fas fa-robot"></i> Боты</a>
      <a href="messages.html" class="nav-item"><i class="fas fa-envelope"></i> Сообщения</a>
      <a href="analytics.html" class="nav-item active"><i class="fas fa-chart-line"></i> Аналитика</a>
      <a href="simulation.html" class="nav-item"><i class="fas fa-flask"></i> Симуляция</a>
      <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Настройки</a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" class="nav-item" onclick="logout(); return false;"><i class="fas fa-sign-out-alt"></i> Выйти</a>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="header-left">
        <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
          <i class="fas fa-bars"></i>
        </button>
        <h1>Аналитика</h1>
      </div>
      <div class="header-right">
        <button class="btn btn-primary" onclick="location.reload()"><i class="fas fa-sync"></i> Обновить</button>
      </div>
    </header>

    <div class="content">
      <div class="stats-grid" id="analyticsStats">
        <div class="stat-card">
          <div class="stat-icon icon-blue"><i class="fas fa-check-circle"></i></div>
          <div class="stat-label">Проанализировано</div>
          <div class="stat-value" id="totalAnalyzed">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-red"><i class="fas fa-exclamation-triangle"></i></div>
          <div class="stat-label">Доля негатива</div>
          <div class="stat-value" id="negativeShare">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-yellow"><i class="fas fa-flag"></i></div>
          <div class="stat-label">Доля жалоб</div>
          <div class="stat-value" id="complaintShare">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-green"><i class="fas fa-fire"></i></div>
          <div class="stat-label">Топ эмоция</div>
          <div class="stat-value" id="topEmotion">—</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card" style="grid-column:1/-1;">
          <h3><i class="fas fa-chart-line" style="margin-right:8px;color:var(--primary);"></i> Динамика за 14 дней</h3>
          <canvas id="analyticsChart" style="max-height:300px;"></canvas>
        </div>
      </div>

      <div class="charts-grid" style="margin-top:20px;">
        <div class="card">
          <div class="card-header">
            <h3><i class="fas fa-exclamation-circle" style="margin-right:8px;color:var(--danger);"></i> Топ жалоб</h3>
          </div>
          <div class="card-body" id="topComplaintsList">
            <div class="empty-state"><p>Нет данных</p></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <h3><i class="fas fa-folder" style="margin-right:8px;color:var(--warning);"></i> Категории</h3>
          </div>
          <div class="card-body" id="categoriesList">
            <div class="empty-state"><p>Нет данных</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/analytics.js"></script>
  <script>checkAuth();</script>
</body>
</html>
