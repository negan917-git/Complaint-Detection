<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Симуляция — Complaint Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="logo-icon">⚡</span>
      Complaint Detection
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item"><i class="fas fa-th-large"></i> Дашборд</a>
      <a href="bots.html" class="nav-item"><i class="fas fa-robot"></i> Боты</a>
      <a href="messages.html" class="nav-item"><i class="fas fa-envelope"></i> Сообщения</a>
      <a href="analytics.html" class="nav-item"><i class="fas fa-chart-line"></i> Аналитика</a>
      <a href="simulation.html" class="nav-item active"><i class="fas fa-flask"></i> Симуляция</a>
      <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Настройки</a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" class="nav-item"><i class="fas fa-sign-out-alt"></i> Выйти</a>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="header-left">
        <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
          <i class="fas fa-bars"></i>
        </button>
        <h1>Симуляция</h1>
      </div>
    </header>

    <div class="content">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;">
        <div>
          <div class="card">
            <div class="card-header">
              <h3><i class="fas fa-pen" style="margin-right:8px;color:var(--primary);"></i> Анализ сообщения</h3>
            </div>
            <div class="card-body">
              <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="simName" placeholder="Например: Иван">
              </div>
              <div class="form-group">
                <label>Сообщение</label>
                <textarea id="simText" placeholder="Введите текст сообщения для анализа..."></textarea>
              </div>
              <button class="btn btn-primary" onclick="analyzeAndSave()">
                <i class="fas fa-microchip"></i> Анализировать и сохранить
              </button>
            </div>
          </div>

          <div style="margin-top:20px;">
            <button class="btn btn-success" onclick="generateDemo()" id="generateBtn">
              <i class="fas fa-bolt"></i> Сгенерировать 10 демо сообщений
            </button>
          </div>
        </div>

        <div id="analysisResultContainer">
          <div class="empty-state" id="analysisPlaceholder">
            <i class="fas fa-flask"></i>
            <p>Запустите анализ сообщения</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/simulation.js"></script>
</body>
</html>
